name: android

# Builds the Android app and runs the unit tests (domain rules, data checks) on every change.
# Release APKs are signed locally with the key in ~/.momentum and published to Appster from there
# (scripts/release.sh), so no signing secrets live in GitHub.

on:
  push:
    branches: [main]
    paths: ["android/**", "data/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "data/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./android/gradlew -p android testDebugUnitTest --no-daemon
      - name: Debug build
        run: ./android/gradlew -p android assembleDebug --no-daemon
