name: backend

# Tests the backend on every change; on main also deploys the SAM stack (infra/) to eu-central-1.
# AWS credentials come from GitHub OIDC (role set up by infra/iam/github-oidc.sh), so no keys are stored.

on:
  push:
    branches: [main]
    paths: ["backend/**", "infra/**", ".github/workflows/deploy.yml"]
  pull_request:
    paths: ["backend/**", "infra/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      SAM_CLI_TELEMETRY: "0"
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
      - run: sam build
      - run: sam deploy --config-env ci --no-confirm-changeset --no-fail-on-empty-changeset
      - name: Smoke test
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name momentum \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          curl -fsS "$URL/health"
