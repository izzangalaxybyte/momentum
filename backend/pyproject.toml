[project]
name = "momentum-api"
version = "0.1.0"
description = "Momentum backend: sync API on AWS Lambda + DynamoDB"
requires-python = ">=3.13,<3.14"
# The Lambda runtime already ships boto3; the API has no other runtime dependencies.
dependencies = []

[dependency-groups]
dev = [
    "boto3>=1.35",
    "moto[dynamodb,ssm]>=5.0",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
